<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZILA AI DeFi Platform</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script><style>

body{margin:0;font-family:Arial;background:#05050a;color:white}

/* animated background */
.bg{
position:fixed;
width:100%;
height:100%;
z-index:-1;
background:radial-gradient(circle at 20% 30%,rgba(120,80,255,.25),transparent 40%),
radial-gradient(circle at 80% 70%,rgba(0,220,255,.25),transparent 40%),#05050a;
filter:blur(40px);
animation:bgmove 12s infinite alternate;
}

@keyframes bgmove{
0%{transform:translateY(0)}
100%{transform:translateY(-60px)}
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 40px;
border-bottom:1px solid #1b1b2e;
background:#070714
}

.logo{
font-size:22px;
font-weight:bold;
letter-spacing:2px;
background:linear-gradient(90deg,#7a5cff,#00eaff);
-webkit-background-clip:text;
color:transparent
}

.wallet-btn{
background:#6a5cff;
border:none;
padding:10px 18px;
border-radius:10px;
color:white;
cursor:pointer
}

.wallet-menu{
position:absolute;
right:40px;
top:70px;
background:#0c0c18;
border:1px solid #1c1c33;
border-radius:10px;
display:none;
flex-direction:column;
min-width:150px
}

.wallet-menu button{
background:none;
border:none;
color:white;
padding:12px;
text-align:left;
cursor:pointer
}

.wallet-menu button:hover{
background:#111124
}

.container{
max-width:1200px;
margin:auto;
padding:30px
}

.dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px
}

.card{
background:#0c0c18;
padding:20px;
border-radius:14px;
border:1px solid #1c1c33
}

.big{font-size:24px;margin-top:10px}

.pool{
background:#0c0c18;
padding:20px;
border-radius:14px;
border:1px solid #1c1c33;
margin-bottom:20px
}

input{
padding:10px;
border:none;
border-radius:8px;
margin-right:10px;
width:120px;
background:#111124;
color:white
}

.actions button{
background:#6a5cff;
border:none;
padding:8px 14px;
border-radius:8px;
color:white;
cursor:pointer;
margin-right:6px;
margin-top:6px
}

/* partners */
.partners{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:30px;
margin-top:40px
}

.partner-card{
background:#0c0c18;
border:1px solid #1c1c33;
border-radius:16px;
padding:20px;
text-align:center
}

.partner-card img{
width:100%;
max-width:120px;
animation:rotate3d 8s linear infinite
}

@keyframes rotate3d{
0%{transform:rotateY(0deg)}
100%{transform:rotateY(360deg)}
}

.footer{text-align:center;padding:30px;color:#777;font-size:13px}

</style></head><body><div class="bg"></div><header><div class="logo">ZILA AI</div><div style="position:relative"><button id="walletButton" class="wallet-btn" onclick="walletButtonClick()">Connect Wallet</button>

<div id="walletMenu" class="wallet-menu"><button onclick="copyWallet()">Copy Address</button> <button onclick="disconnectWallet()">Disconnect Wallet</button>

</div></div></header><div class="container"><div class="dashboard"><div class="card">
<h3>Wallet Balance</h3>
<div class="big" id="walletBalance">0</div>
</div><div class="card">
<h3>ZILA Balance</h3>
<div class="big" id="zilaBalance">0</div>
</div><div class="card">
<h3>Total Value Locked</h3>
<div class="big" id="tvl">0</div>
</div><div class="card">
<h3>Pending Rewards</h3>
<div class="big" id="rewards">0</div>
<button onclick="claimReward()">Claim</button>
</div><div class="card">
<h3>Estimated APR</h3>
<div class="big" id="apr">0%</div>
</div></div><div class="pool">
<h3>Pool 0 — Stake ZILA</h3>
<input id="zilaAmount" placeholder="Amount" />
<div class="actions">
<button onclick="stake(0,'zilaAmount')">Stake</button>
<button onclick="withdraw(0,'zilaAmount')">Withdraw</button>
</div>
</div><div class="pool">
<h3>Pool 1 — Stake USDT</h3>
<input id="usdtAmount" placeholder="Amount" />
<div class="actions">
<button onclick="stake(1,'usdtAmount')">Stake</button>
<button onclick="withdraw(1,'usdtAmount')">Withdraw</button>
</div>
</div><div class="pool">
<h3>Pool 2 — Stake ZILA-USDT LP</h3>
<input id="lpAmount" placeholder="Amount" />
<div class="actions">
<button onclick="stake(2,'lpAmount')">Stake</button>
<button onclick="withdraw(2,'lpAmount')">Withdraw</button>
</div>
</div><h2 style="text-align:center;margin-top:50px">Partnership</h2><div class="partners"><div class="partner-card">
<img src="partner1.png">
<p>Partner</p>
</div><div class="partner-card">
<img src="partner2.png">
<p>Partner</p>
</div><div class="partner-card">
<img src="partner3.png">
<p>Partner</p>
</div><div class="partner-card">
<img src="partner4.png">
<p>Partner</p>
</div></div></div><div class="footer">ZILA AI DeFi Platform</div><script>

let provider;
let signer;
let userAddress=null;

const MASTER_CHEF="YOUR_MASTERCHEF_CONTRACT";
const ZILA_TOKEN="YOUR_ZILA_TOKEN";

const chefABI=[
"function deposit(uint256,uint256)",
"function withdraw(uint256,uint256)",
"function pendingReward(uint256,address) view returns(uint256)",
"function zilaPerBlock() view returns(uint256)"
];

const erc20ABI=["function balanceOf(address) view returns(uint256)"];

/* wallet button logic */

async function walletButtonClick(){

if(!userAddress){

await connectWallet();

}else{

toggleMenu();

}

}

function toggleMenu(){

const menu=document.getElementById("walletMenu");

menu.style.display=menu.style.display==='flex'?'none':'flex';

}

async function connectWallet(){

await window.ethereum.request({method:'eth_requestAccounts'});

provider=new ethers.providers.Web3Provider(window.ethereum);

signer=provider.getSigner();

userAddress=await signer.getAddress();

/* request sign message */

await signer.signMessage("Sign to access ZILA AI DeFi Platform");

updateWalletUI();

loadDashboard();

setInterval(loadDashboard,8000);

}

function updateWalletUI(){

const btn=document.getElementById("walletButton");

btn.innerText=userAddress.slice(0,6)+"..."+userAddress.slice(-4);

}

function copyWallet(){

navigator.clipboard.writeText(userAddress);

alert("Address copied");

}

function disconnectWallet(){

userAddress=null;

provider=null;

signer=null;

const btn=document.getElementById("walletButton");

btn.innerText="Connect Wallet";

const menu=document.getElementById("walletMenu");

menu.style.display='none';

}

async function loadDashboard(){

if(!provider||!userAddress)return;

const token=new ethers.Contract(ZILA_TOKEN,erc20ABI,provider);

const chef=new ethers.Contract(MASTER_CHEF,chefABI,provider);

const balance=await provider.getBalance(userAddress);

const eth=ethers.utils.formatEther(balance);


document.getElementById("walletBalance").innerText=parseFloat(eth).toFixed(4);

const zilaBal=await token.balanceOf(userAddress);

const zila=ethers.utils.formatUnits(zilaBal,18);


document.getElementById("zilaBalance").innerText=parseFloat(zila).toFixed(2);

const pending=await chef.pendingReward(0,userAddress);

const reward=ethers.utils.formatUnits(pending,18);


document.getElementById("rewards").innerText=parseFloat(reward).toFixed(4)+" ZILA";

const tvlRaw=await token.balanceOf(MASTER_CHEF);

const tvl=ethers.utils.formatUnits(tvlRaw,18);


document.getElementById("tvl").innerText=parseFloat(tvl).toLocaleString()+" ZILA";

try{

const rewardPerBlock=await chef.zilaPerBlock();

const perBlock=ethers.utils.formatUnits(rewardPerBlock,18);

const yearly=perBlock*10512000;

const apr=(yearly/tvl)*100;


document.getElementById("apr").innerText=apr.toFixed(2)+"%";

}catch{}

}

async function stake(pid,input){

const amount=document.getElementById(input).value;

const chef=new ethers.Contract(MASTER_CHEF,chefABI,signer);

const tx=await chef.deposit(pid,ethers.utils.parseUnits(amount,18));

await tx.wait();

loadDashboard();

}

async function withdraw(pid,input){

const amount=document.getElementById(input).value;

const chef=new ethers.Contract(MASTER_CHEF,chefABI,signer);

const tx=await chef.withdraw(pid,ethers.utils.parseUnits(amount,18));

await tx.wait();

loadDashboard();

}

async function claimReward(){

const chef=new ethers.Contract(MASTER_CHEF,chefABI,signer);

const tx=await chef.deposit(0,0);

await tx.wait();

loadDashboard();

}

</script></body>
                                             </html>
